[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env-timeseries-course"
version = "0.1.0"
description = "Course materials and utilities for environmental time-series analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.25",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
